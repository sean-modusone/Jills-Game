<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jill's World Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..600&display=swap">
<link rel="stylesheet" href="design-system.css">
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font);
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bot));
    color: var(--ink);
    overflow: hidden;
  }
  header {
    text-align: center;
    padding: 10px 8px 4px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 600;
    letter-spacing: .5px;
    text-shadow: 2px 2px 0 #fff;
  }
  header p { margin: 2px 0 0; font-size: 13px; opacity: 0.7; }

  #app {
    display: flex;
    gap: 12px;
    padding: 8px 14px 14px;
    height: calc(100% - 70px);
    align-items: stretch;
    justify-content: center;
  }

  .panel {
    background: var(--panel);
    border: var(--stroke) solid var(--ink);
    border-radius: var(--r-card);
    box-shadow: 0 var(--lift) 0 var(--ink);
    padding: 12px;
  }

  /* Palette */
  #palette {
    width: 168px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.55;
    margin: 4px 2px;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .tile-btn {
    position: relative;
    font-size: 26px;
    aspect-ratio: 1;
    border: var(--stroke) solid var(--ink);
    border-radius: var(--r-tile);
    background: var(--tile);
    cursor: pointer;
    transition: transform .08s, border-color .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-btn:hover { transform: scale(1.08); }
  .tile-btn.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .tile-btn.selected::after {
    content: "\2713"; position: absolute; top: -8px; right: -8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--ink);
  }

  /* Tools */
  #tools {
    width: 150px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tool-btn {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    padding: 10px 12px;
    border: var(--stroke) solid var(--ink);
    border-radius: var(--r-btn);
    background: var(--paper);
    box-shadow: 0 4px 0 var(--ink);
    cursor: pointer;
    text-align: left;
    transition: transform .08s, background .1s;
  }
  .tool-btn:hover { transform: translateY(-2px); }
  .tool-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .tool-btn.active { background: var(--accent2); color: #fff; }
  .tool-btn.big { background: var(--accent); color: #fff; }
  .tool-btn .ico { margin-right: 6px; }
  hr { border: none; border-top: 3px dashed #e6dff2; margin: 6px 0; }

  /* Board */
  #board-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 1 auto;
  }
  #board {
    display: grid;
    gap: 0;
    background: #8fd694;
    border: var(--stroke) solid var(--ink);
    border-radius: var(--r-tile);
    box-shadow: inset 0 0 0 4px #79c47e, 0 var(--lift) 0 var(--ink);
    padding: 4px;
    touch-action: none;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    border-radius: 6px;
  }
  .cell:hover { background: rgba(255,255,255,0.35); }

  .hint {
    font-size: 12px; opacity: 0.6; text-align: center; margin-top: 6px;
  }

  @media (max-width: 820px) {
    #palette { width: 130px; }
    #tools { width: 120px; }
  }
</style>
</head>
<body>
  <a class="ds-home" href="index.html">🏠 Home</a>
  <header>
    <h1>🌟 Jill's World Builder 🌟</h1>
    <p>Pick something, then tap the grid to build your world!</p>
  </header>

  <div id="app">
    <div id="palette" class="panel"></div>

    <div id="board-wrap" class="panel" style="background:transparent; box-shadow:none; padding:0;">
      <div>
        <div id="board"></div>
        <div class="hint">Tip: hold and drag to paint lots of squares at once 🎨</div>
      </div>
    </div>

    <div id="tools" class="panel">
      <div class="section-title">Tools</div>
      <button class="tool-btn active" data-tool="paint"><span class="ico">🖌️</span>Paint</button>
      <button class="tool-btn" data-tool="erase"><span class="ico">🧽</span>Eraser</button>
      <button class="tool-btn" data-tool="fill"><span class="ico">🪣</span>Fill area</button>
      <hr>
      <div class="section-title">My World</div>
      <button class="tool-btn big" id="saveBtn"><span class="ico">💾</span>Save</button>
      <button class="tool-btn" id="loadBtn"><span class="ico">📂</span>Load</button>
      <button class="tool-btn" id="surpriseBtn"><span class="ico">🎲</span>Surprise!</button>
      <button class="tool-btn" id="clearBtn"><span class="ico">🧹</span>Clear all</button>
    </div>
  </div>

<script>
(function () {
  // ---- The things Jill can place. Add your own emojis here! ----
  const PALETTE = {
    "Nature":   ["🌳","🌲","🌴","🌸","🌷","🌻","🍄","🌵","🪨","🌊"],
    "Buildings":["🏠","🏡","🏰","⛪","🏫","🏪","⛲","🌉","🎡","⛺"],
    "Paths":    ["🟫","🟩","🟦","🟨","⬜","🛤️"],
    "Friends":  ["🐶","🐱","🐰","🦊","🐻","🦄","🐲","🦋","🐤","🧚"]
  };

  const COLS = 14, ROWS = 12;
  const STORAGE_KEY = "jills-world-v1";

  let current = "🌳";
  let tool = "paint";
  let painting = false;
  const grid = Array.from({length: ROWS}, () => Array(COLS).fill(""));

  // ---- Build the palette ----
  const paletteEl = document.getElementById("palette");
  function buildPalette() {
    const title = document.createElement("div");
    title.className = "section-title";
    title.textContent = "Things to place";
    paletteEl.appendChild(title);

    for (const group in PALETTE) {
      const gt = document.createElement("div");
      gt.className = "section-title";
      gt.textContent = group;
      gt.style.opacity = 0.4;
      paletteEl.appendChild(gt);

      const wrap = document.createElement("div");
      wrap.className = "tiles";
      PALETTE[group].forEach(emoji => {
        const b = document.createElement("button");
        b.className = "tile-btn" + (emoji === current ? " selected" : "");
        b.textContent = emoji;
        b.onclick = () => {
          current = emoji;
          tool = "paint";
          setActiveTool();
          document.querySelectorAll(".tile-btn").forEach(t => t.classList.remove("selected"));
          b.classList.add("selected");
        };
        wrap.appendChild(b);
      });
      paletteEl.appendChild(wrap);
    }
  }

  // ---- Build the board ----
  const board = document.getElementById("board");
  function sizeBoard() {
    const maxW = Math.min(window.innerWidth - 360, 760);
    const maxH = window.innerHeight - 150;
    const cell = Math.max(28, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
    board.style.gridTemplateColumns = `repeat(${COLS}, ${cell}px)`;
    document.querySelectorAll(".cell").forEach(c => {
      c.style.width = cell + "px";
      c.style.height = cell + "px";
      c.style.fontSize = Math.floor(cell * 0.7) + "px";
    });
  }

  function buildBoard() {
    board.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.r = r; cell.dataset.c = c;
        cell.textContent = grid[r][c];
        cell.addEventListener("pointerdown", e => { e.preventDefault(); painting = true; apply(cell); });
        cell.addEventListener("pointerenter", () => { if (painting) apply(cell); });
        board.appendChild(cell);
      }
    }
    sizeBoard();
  }

  function apply(cell) {
    const r = +cell.dataset.r, c = +cell.dataset.c;
    if (tool === "paint") setCell(r, c, current);
    else if (tool === "erase") setCell(r, c, "");
    else if (tool === "fill") floodFill(r, c, grid[r][c], current);
  }

  function setCell(r, c, val) {
    grid[r][c] = val;
    const cell = board.children[r * COLS + c];
    cell.textContent = val;
  }

  function floodFill(r, c, target, replacement) {
    if (target === replacement) return;
    const stack = [[r, c]];
    while (stack.length) {
      const [cr, cc] = stack.pop();
      if (cr < 0 || cc < 0 || cr >= ROWS || cc >= COLS) continue;
      if (grid[cr][cc] !== target) continue;
      setCell(cr, cc, replacement);
      stack.push([cr+1,cc],[cr-1,cc],[cr,cc+1],[cr,cc-1]);
    }
  }

  document.addEventListener("pointerup", () => painting = false);
  document.addEventListener("pointercancel", () => painting = false);

  // ---- Tools ----
  function setActiveTool() {
    document.querySelectorAll(".tool-btn[data-tool]").forEach(b => {
      b.classList.toggle("active", b.dataset.tool === tool);
    });
  }
  document.querySelectorAll(".tool-btn[data-tool]").forEach(b => {
    b.onclick = () => { tool = b.dataset.tool; setActiveTool(); };
  });

  // ---- Save / Load / Clear / Surprise ----
  document.getElementById("saveBtn").onclick = () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(grid));
      flash("Saved! 💾");
    } catch (e) { flash("Couldn't save here 😅"); }
  };
  document.getElementById("loadBtn").onclick = () => {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!data) { flash("Nothing saved yet"); return; }
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          setCell(r, c, data[r] && data[r][c] ? data[r][c] : "");
      flash("Loaded! 📂");
    } catch (e) { flash("Couldn't load 😅"); }
  };
  document.getElementById("clearBtn").onclick = () => {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) setCell(r, c, "");
    flash("Fresh start! 🧹");
  };
  document.getElementById("surpriseBtn").onclick = () => {
    const all = Object.values(PALETTE).flat();
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const roll = Math.random();
        setCell(r, c, roll < 0.55 ? "" : all[Math.floor(Math.random()*all.length)]);
      }
    flash("Ta-da! 🎲");
  };

  // ---- Little message popup ----
  let flashTimer;
  function flash(msg) {
    let el = document.getElementById("flash");
    if (!el) {
      el = document.createElement("div");
      el.id = "flash";
      el.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2d42;color:#fff;padding:10px 18px;border-radius:20px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:99;transition:opacity .3s";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => el.style.opacity = "0", 1200);
  }

  window.addEventListener("resize", sizeBoard);

  buildPalette();
  buildBoard();
})();
</script>
</body>
</html>
