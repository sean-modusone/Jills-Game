<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Horse 🐎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Cormorant+Garamond:ital@0;1&display=swap">
<link rel="stylesheet" href="design-system.css">
<style>
  :root{
    --ink:#3d3227; --paper:#faf6ee; --tile:#f3ecdd;
    --accent:#7a5230; --accent-soft:#e9dcc8; --accent2:#5f7d4f;
    --gold:#c9973f; --lilac:#8d7a63;
    --font:"Nunito","Trebuchet MS",system-ui,sans-serif;
    --stroke:2px; --lift:4px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);
    background:linear-gradient(180deg,#9ecbe8 0%,#cde4d8 58%,#c9dfc0 70%);
    display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}

  /* ---------- START + COAT SCREENS ---------- */
  .screen{display:none;flex-direction:column;align-items:center;padding:52px 16px 60px;width:100%;}
  .screen.show{display:flex;}
  .screen h1{font-size:clamp(30px,5.5vw,46px);font-weight:800;margin:2px 0 0;letter-spacing:.5px;text-align:center;}
  .screen .sub{opacity:.75;margin:8px 0 26px;text-align:center;font-style:italic;
    font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;}
  .card{background:var(--paper);border:var(--stroke) solid var(--ink);border-radius:14px;
    box-shadow:0 var(--lift) 0 rgba(61,50,39,.55);padding:28px 28px 30px;max-width:430px;width:100%;
    display:flex;flex-direction:column;gap:16px;}
  label{font-weight:700;font-size:15px;display:block;margin-bottom:6px;letter-spacing:.3px;}
  input[type=text]{width:100%;font-family:var(--font);font-size:18px;color:var(--ink);
    background:var(--tile);border:var(--stroke) solid var(--ink);border-radius:10px;
    padding:12px 14px;outline:none;}
  input[type=text]:focus{background:#fff;border-color:var(--accent);}
  .btn{font-family:var(--font);font-weight:800;font-size:18px;color:#fff;background:var(--accent);
    border:var(--stroke) solid var(--ink);border-radius:10px;padding:13px 20px;cursor:pointer;
    box-shadow:0 var(--lift) 0 rgba(61,50,39,.55);transition:transform .08s;letter-spacing:.4px;}
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,50,39,.55);}
  .btn.small{font-size:14px;padding:9px 14px;background:var(--accent2);}
  .btn.tan{background:var(--gold);color:#fff;}
  .namerow{display:flex;gap:8px;align-items:flex-end;}
  .namerow > div{flex:1;}
  .shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* live 3D preview of your pony and rider */
  .previewSlot{width:min(94vw,620px);height:340px;margin:0 auto 14px;border-radius:18px;
    border:3px solid var(--ink);background:linear-gradient(180deg,#cfe6f5,#e8f2df);
    box-shadow:0 6px 0 rgba(61,50,39,.35);overflow:hidden;position:relative;}
  .previewSlot canvas{display:block;width:100%;height:100%;}
  .previewSlot .spin{position:absolute;right:10px;bottom:8px;font-size:12px;font-weight:700;
    opacity:.6;pointer-events:none;}
  @media (max-height:760px){ .previewSlot{height:250px;} }

  /* coat picker */
  .coatGrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:680px;}
  .coatBtn{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
    background:var(--paper);border:var(--stroke) solid var(--ink);border-radius:14px;
    padding:16px 18px 12px;box-shadow:0 var(--lift) 0 rgba(61,50,39,.55);
    font-family:var(--font);font-weight:800;font-size:15px;color:var(--ink);
    transition:transform .08s;min-width:108px;}
  .coatBtn:hover{transform:translateY(-3px);}
  .coatBtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,50,39,.55);}
  .coatBtn .sw{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--ink);position:relative;overflow:hidden;}
  .coatBtn .sw i{position:absolute;left:0;top:0;bottom:0;width:34%;}
  .coatBtn small{font-weight:600;opacity:.65;font-size:12px;margin-top:-4px;}

  /* rider designer */
  .rdCard{background:var(--paper);border:var(--stroke) solid var(--ink);border-radius:14px;
    box-shadow:0 var(--lift) 0 rgba(61,50,39,.55);padding:22px 28px 26px;max-width:460px;width:100%;}
  .rdCard h3{font-size:14px;letter-spacing:.6px;margin:10px 0 8px;}
  .swRow{display:flex;gap:12px;flex-wrap:wrap;}
  .swBtn{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;
    box-shadow:0 3px 0 rgba(61,50,39,.4);padding:0;}
  .swBtn:active{transform:translateY(2px);box-shadow:none;}
  .swBtn.sel{outline:4px solid var(--accent2);outline-offset:2px;}

  /* ---------- PASTURE / STABLE / RIDING ---------- */
  #pasture{display:none;flex-direction:column;align-items:center;width:100%;min-height:100vh;position:relative;}
  #pasture.show{display:flex;}
  #pasture h2{font-size:clamp(20px,4vw,30px);font-weight:800;margin:60px 0 0;z-index:2;text-align:center;padding:0 14px;}
  .narrate{z-index:2;margin-top:6px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
    font-size:clamp(18px,3vw,23px);color:#4a3d2f;text-align:center;max-width:560px;padding:0 18px;min-height:30px;
    transition:opacity .35s;}
  .narrate.dim{opacity:0;}
  .scene{position:relative;z-index:1;width:min(94vw,800px);margin-top:0;transition:opacity .7s;}
  .scene.fade{opacity:0;}
  .scene svg{width:100%;height:auto;display:block;}
  #horseG{cursor:pointer;}
  #walkGroup{transform:translateX(0);}
  #walkGroup.walking{transition:transform 3.4s ease-in-out;transform:translateX(-460px);}
  #walkGroup.walking #horseG{animation:walkbob .55s ease-in-out infinite;}
  #walkGroup.walking #riderG{animation:walkbob .55s ease-in-out infinite .27s;}
  @keyframes walkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .nudge{animation:nudge .9s ease;}
  @keyframes nudge{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px)}55%{transform:translateY(0)}75%{transform:translateY(-3px)}}
  .graze{animation:graze 1.4s ease;}
  @keyframes graze{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(3deg) translateY(7px)}}
  #tail{transform-origin:572px 215px;animation:swish 5.5s ease-in-out infinite;}
  @keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
  #earNear{transform-origin:190px 108px;animation:earflick 7s ease-in-out infinite;}
  @keyframes earflick{0%,90%,100%{transform:rotate(0)}93%,96%{transform:rotate(-13deg)}}
  .cloud{animation:drift 70s linear infinite;}
  .cloud.c2{animation-duration:95s;animation-delay:-38s;}
  @keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(1080px)}}
  .actions{z-index:2;display:flex;gap:10px;margin:14px 0 44px;flex-wrap:wrap;justify-content:center;max-width:760px;}
  .actions.hidden{display:none;}
  .btn.hidden{display:none;}
  .float{position:fixed;font-size:26px;z-index:5;pointer-events:none;animation:floatUp 1.3s forwards;}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.75)}100%{opacity:0;transform:translateY(-110px) scale(1.25)}}

  /* ============ RIDING: legs, bob, parallax ============ */
  #legFN,#legFF,#legHN,#legHF{transform-box:view-box;}
  #legFN{transform-origin:306px 350px;}
  #legFF{transform-origin:345px 354px;}
  #legHN{transform-origin:578px 342px;}
  #legHF{transform-origin:504px 352px;}
  #horseG,#nearScroll{transform-box:view-box;}
  @keyframes swingA{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
  @keyframes swingB{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  @keyframes swingAT{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
  @keyframes swingBT{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  @keyframes bobW{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes bobT{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes bobC{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-2deg)}60%{transform:translateY(-2px) rotate(1.2deg)}}
  @keyframes scrollNear{from{transform:translateX(0)}to{transform:translateX(900px)}}

  .gait-walk #legFN,.gait-walk #legHF{animation:swingA 1.1s ease-in-out infinite;}
  .gait-walk #legFF,.gait-walk #legHN{animation:swingB 1.1s ease-in-out infinite;}
  .gait-walk #horseG{animation:bobW 1.1s ease-in-out infinite;}
  .gait-walk #nearScroll{animation:scrollNear 8s linear infinite;}

  .gait-trot #legFN,.gait-trot #legHF{animation:swingAT .55s ease-in-out infinite;}
  .gait-trot #legFF,.gait-trot #legHN{animation:swingBT .55s ease-in-out infinite;}
  .gait-trot #horseG{animation:bobT .55s ease-in-out infinite;}
  .gait-trot #nearScroll{animation:scrollNear 3.6s linear infinite;}

  .gait-canter #legFN,.gait-canter #legHF{animation:swingAT .42s ease-in-out infinite;}
  .gait-canter #legFF,.gait-canter #legHN{animation:swingBT .42s ease-in-out infinite;}
  .gait-canter #horseG{animation:bobC .42s ease-in-out infinite;}
  .gait-canter #nearScroll{animation:scrollNear 1.9s linear infinite;}
</style>
</head>
<body>
<a class="ds-home" href="index.html">🏠 Home</a>

<!-- ================= START ================= -->
<div id="start" class="screen show">
  <h1>THE STABLES</h1>
  <p class="sub">Every great horse remembers the day it was named…</p>
  <div class="card" id="nameCard">
    <div>
      <label for="playerName">YOUR NAME</label>
      <input type="text" id="playerName" maxlength="20" placeholder="Type your name…" autocomplete="off">
    </div>
    <div class="namerow">
      <div>
        <label for="horseName">YOUR HORSE'S NAME</label>
        <input type="text" id="horseName" maxlength="20" placeholder="Type a horse name…" autocomplete="off">
      </div>
      <button class="btn small" id="surpriseBtn" title="Pick a name for me!">✨</button>
    </div>
    <button class="btn" id="goBtn">Open the gate →</button>
  </div>
</div>

<!-- ================= COAT PICKER ================= -->
<div id="coatPick" class="screen">
  <h1 id="coatTitle">CHOOSE YOUR PONY</h1>
  <p class="sub">Which coat does your horse have?</p>
  <div id="previewSlotCoat" class="previewSlot"></div>
  <div class="coatGrid" id="coatGrid"></div>
</div>

<!-- ================= RIDER DESIGNER ================= -->
<div id="riderPick" class="screen">
  <h1>DESIGN YOUR RIDER</h1>
  <p class="sub">Hair, riding clothes, helmet — make them yours!</p>
  <div id="previewSlotRider" class="previewSlot"></div>
  <div class="rdCard">
    <h3>🧍 WHO ARE YOU RIDING AS?</h3>
    <div id="riderModelRow" style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;"></div>
    <p id="riderModelNote" class="sub" style="margin:4px 0 12px;font-size:13px;"></p>
    <h3>💇 HAIR</h3>
    <div class="swRow" data-cat="hair"></div>
    <h3>🧥 RIDING TOP</h3>
    <div class="swRow" data-cat="top"></div>
    <h3>👖 JODHPURS</h3>
    <div class="swRow" data-cat="jods"></div>
    <h3>🪖 HELMET</h3>
    <div class="swRow" data-cat="helmet"></div>
    <button class="btn" id="riderDoneBtn" style="margin-top:18px;width:100%;">Looking smart! →</button>
  </div>
</div>

<script>

const surpriseNames = ["Willow","Storm","Chestnut","Midnight","Copper","River","Autumn","Shadow","Ember","Luna","Bella","Spirit","Duchess","Comet","Hazel","Juniper","Onyx","Sierra","Maple","Aspen"];

  cream:    {label:"Cream",       hint:"nearly white",       top:"#f4eee2", mid:"#e8dfcd", low:"#c9bda3", farTop:"#ddd2bb", farLow:"#b3a68b", mane:"#e9e2d2", maneHi:"#cfc3aa", points:false, muzzle:"#8d7f6c"},

  appaloosa:{label:"Appaloosa",   hint:"spotty bottom!",     top:"#9c6a44", mid:"#8a5a38", low:"#6b4225", farTop:"#7a4e2e", farLow:"#573517", mane:"#2f2419", maneHi:"#544230", points:false, muzzle:"#39302a", appy:true}
};

const BRUSHES = {
  curry: [
    "You rub the rubber curry comb in big circles — clouds of dust puff out of {h}'s coat.",
    "Round and round with the curry comb. {h} wiggles those lips — that's the good spot!",
  ],
  dandy: [
    "Flick, flick! The stiff dandy brush sweeps away all the dirt the curry comb loosened.",
    "You flick the dandy brush along {h}'s coat and the dried mud goes flying.",
  ],
  body: [
    "Long, smooth strokes with the soft body brush — {h}'s coat starts to gleam.",
    "The body brush glides over {h}'s coat like silk.",
  ],
  mane: [
    "You comb {h}'s mane gently, starting from the bottom of the tangles like a real groom.",
    "One stroke at a time, {h}'s mane turns smooth and silky.",
  ],
  hoof: [
    "You run your hand down {h}'s leg and pick out the hoof — front to back, always.",
    "{h} rests a hoof in your hand while you carefully pick it clean. Perfect trust.",
  ]
};
const BRUSH_FX = { curry:"💨", dandy:"💨", body:"✨", mane:"✨", hoof:"🪨" };

const TACK_STEPS = [
  { btn:"🐴 Tack up: saddle pad", },
  { show:"tackPad",    narr:"You lay the soft saddle pad gently on {h}'s back.",            btn:"🐴 Tack up: saddle + girth" },
  { show:"tackSaddle", narr:"You lift the saddle on and buckle the girth — snug, not tight.", btn:"🐴 Tack up: bridle" },
  { show:"tackBridle", narr:"Head collar off, bridle on — {h} takes the bit politely. Ready to ride!", btn:"✅ Tacked up!" }

const GAITS = {
  walk:   "Clip… clop… {h} walks out on a long rein, ears swinging happily.",
  trot:   "You rise to the trot — one-two, one-two — {h}'s hooves drum the ground.",
  canter: "You sit deep and {h} lifts into a rocking canter — da-da-DUM, da-da-DUM!"
};

const $ = id => document.getElementById(id);
let state = { player:"", horse:"", coat:"" };
let halterOn = false, mode = "pasture", busy = false, tackStage = 0;
let brushesUsed = new Set();

try{
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if(saved && saved.player){ state = Object.assign(state, saved); $("playerName").value = saved.player; $("horseName").value = saved.horse; }
}catch(e){}
state.rider = Object.assign({hair:"#6b4226", top:"#8f4a5a", jods:"#dcc49e", helmet:"#263a5e"}, state.rider || {});


function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

/* ---- rider designer ---- */
const RIDER_OPTS = {
  hair:   ["#e8c56b","#6b4226","#2a2320","#b5502a","#ff9db3"],
  top:    ["#8f4a5a","#2e4a7d","#3f6d3f","#c2554a","#7a6aa5"],
  jods:   ["#dcc49e","#f0ede6","#9aa0a8","#33291f"],
  helmet: ["#263a5e","#1d1a17","#d96a8f","#b8bdc6"]
};
function applyRider(){
  const r = state.rider;
  document.querySelectorAll(".r-hair").forEach(e=>e.setAttribute("fill", r.hair));
  document.querySelectorAll(".r-top").forEach(e=>e.setAttribute("fill", r.top));
  document.querySelectorAll(".r-jods").forEach(e=>e.setAttribute("fill", r.jods));
  document.querySelectorAll(".r-helmet").forEach(e=>e.setAttribute("fill", r.helmet));
}
function refreshSwSel(){
  document.querySelectorAll(".swRow").forEach(row=>{
    const cat = row.dataset.cat;
    [...row.children].forEach((b,i)=>b.classList.toggle("sel", RIDER_OPTS[cat][i] === state.rider[cat]));
  });
}
document.querySelectorAll(".swRow").forEach(row=>{
  const cat = row.dataset.cat;
  RIDER_OPTS[cat].forEach(hex=>{
    const b = document.createElement("button");
    b.className = "swBtn";
    b.style.background = hex;
    b.onclick = ()=>{ state.rider[cat] = hex; save(); applyRider(); refreshSwSel(); };
    row.appendChild(b);
  });
});
refreshSwSel();

function applyCoat(key){
  const c = COATS[key]; if(!c) return;
  state.coat = key;
  const stops = document.querySelectorAll("#coat stop");
  stops[0].setAttribute("stop-color", c.top);
  stops[1].setAttribute("stop-color", c.mid);
  stops[2].setAttribute("stop-color", c.low);

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const COATS3D = {
  bay:      {main:0x946035, dark:0x1f1812},
  black:    {main:0x35343b, dark:0x0e0d10},
  chestnut: {main:0xa0552f, dark:0x6f3a1f},

  palomino: {main:0xd5a55b, dark:0xf2e8d5},

  pinto:    {main:0x8c4f2c, dark:0x3a2c20},

};
const canvas = document.createElement("canvas");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdff1ff, 0x7f9a64, 1.1));

sun.position.set(4, 8, 6);

scene.add(stage);

turf.rotation.x = -Math.PI/2;

let horseMats = {}, riderMats = {top:[], topLight:[], jods:[], hair:[]}, helmetMesh = null;
let mixers = [];
const clock = new THREE.Clock();

new GLTFLoader().parse(HORSE_GLTF_JSON, '', (g) => {
  const m = g.scene;
  m.scale.setScalar(0.42);
  m.position.set(-1.15, 0, 0);
  m.rotation.y = Math.PI/2 + 0.5;
  const seen = new Set();
  m.traverse(o => {
    if(!o.isMesh) return;
    for(const mm of (Array.isArray(o.material) ? o.material : [o.material])){
      if(seen.has(mm.uuid)) continue;
      seen.add(mm.uuid);
      if(!horseMats[mm.name]) horseMats[mm.name] = [];
      horseMats[mm.name].push(mm);
    }
  });
  const mx = new THREE.AnimationMixer(m);
  const idle = g.animations.find(a => a.name === "Idle") || g.animations[0];
  if(idle) mx.clipAction(idle).play();
  mixers.push(mx);
  stage.add(m);
  applyCoat3D((window.__state && window.__state.coat) || "bay");
});

new GLTFLoader().parse(RIDER_GLTF_JSON, '', (g) => {
  const r = g.scene;
  r.scale.setScalar(0.95);
  r.position.set(1.25, 0, 0.2);
  r.rotation.y = -0.35;
  const seen = new Set();
  let headBone = null;
  r.traverse(o => {
    if(o.isBone && o.name === "Head") headBone = o;
    if(!o.isMesh) return;
    for(const mm of (Array.isArray(o.material) ? o.material : [o.material])){
      if(seen.has(mm.uuid)) continue;
      seen.add(mm.uuid);
      if(mm.name === "Hair_Brown") riderMats.hair.push(mm);
      else if(mm.name === "Green") riderMats.top.push(mm);
      else if(mm.name === "LightGreen") riderMats.topLight.push(mm);
      else if(mm.name === "Brown2" || mm.name === "Brown_02") riderMats.jods.push(mm);
    }
  });
  if(headBone){
    const helm = new THREE.Mesh(
      new THREE.SphereGeometry(0.135, 18, 12, 0, Math.PI*2, 0, 1.45),
      new THREE.MeshStandardMaterial({color:0x263a5e, roughness:0.45})
    );
    helm.position.set(0.01, 0.115, -0.02);
    helm.scale.set(1, 1.35, 1.05);
    const peak = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 10), helm.material);
    peak.scale.set(0.42, 0.05, 0.5);
    peak.position.set(0, 0.012, 0.125);
    peak.rotation.x = -0.18;
    helm.add(peak);
    headBone.add(helm);
    helmetMesh = helm;
  }
  const mx = new THREE.AnimationMixer(r);
  const idle = g.animations.find(a => a.name === "Idle") || g.animations[0];
  if(idle) mx.clipAction(idle).play();
  mixers.push(mx);
  stage.add(r);
  classicModel = r;
  setRiderModel3D((window.__state && window.__state.riderModel) || "classic");
  applyRider3D((window.__state && window.__state.rider) || {hair:"#6b4226", top:"#8f4a5a", jods:"#dcc49e", helmet:"#263a5e"});
});

/* the ready-made rider, stood next to the colour-in one */
let womanModel = null, womanHelmet = null;
if(typeof RIDER2_GLB_B64 === "string"){
  const raw = atob(RIDER2_GLB_B64), bytes = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  new GLTFLoader().parse(bytes.buffer, '', (g) => {
    const w = g.scene;
    /* NB: Box3 on a skinned mesh lies (the geometry sits at the origin and the
       skeleton does the work), so size her off the Head bone instead. */
    w.scale.setScalar(0.34);
    w.position.set(1.25, 0, 0.2);
    w.rotation.y = -0.35;
    let headB = null;
    w.traverse(o => {
      /* skinned meshes get culled wrongly when the parent is scaled — keep her on screen */
      if(o.isMesh){ o.castShadow = true; o.frustumCulled = false; }
      if(o.isBone && o.name === "Head") headB = o;
    });
    if(headB){
      /* her bones are in their own units, so work out how big a real-world
         0.14 radius hat is in head-bone space */
      w.updateMatrixWorld(true);
      const hs = headB.getWorldScale(new THREE.Vector3()).x || 1;
      const u = 0.135 / hs;
      const helm = new THREE.Mesh(
        new THREE.SphereGeometry(u, 18, 12, 0, Math.PI*2, 0, 1.45),
        new THREE.MeshStandardMaterial({color:0x263a5e, roughness:0.45})
      );
      helm.position.set(0, u*0.55, u*0.06);
      helm.scale.set(1, 1.3, 1.05);
      const peak = new THREE.Mesh(new THREE.SphereGeometry(u*0.95, 16, 10), helm.material);
      peak.scale.set(0.42, 0.05, 0.5);
      peak.position.set(0, u*0.08, u*0.9);
      helm.add(peak);
      headB.add(helm);
      womanHelmet = helm;
    }
    const mx = new THREE.AnimationMixer(w);
    const idle = g.animations.find(a => /Idle$/.test(a.name)) || g.animations[0];
    if(idle) mx.clipAction(idle).play();
    mixers.push(mx);
    womanModel = w;
    stage.add(w);
    setRiderModel3D((window.__state && window.__state.riderModel) || "classic");
  });
}
let classicModel = null;
function setRiderModel3D(id){
  if(classicModel) classicModel.visible = (id === "classic");
  if(womanModel) womanModel.visible = (id !== "classic");
}
function applyCoat3D(key){
  const c = COATS3D[key] || COATS3D.bay;
  const set = (name, hex, dl) => (horseMats[name] || []).forEach(m => {
    m.color.setHex(hex);
    if(dl) m.color.offsetHSL(0, 0, dl);
  });
  set("Main", c.main); set("Main_Light", c.main, 0.08); set("Main_Dark", c.main, -0.07);
  set("Hair", c.dark); set("Muzzle", c.dark, 0.05);
}
function applyRider3D(cfg){
  if(!cfg) return;
  riderMats.hair.forEach(m => m.color.set(cfg.hair));
  riderMats.top.forEach(m => m.color.set(cfg.top));
  riderMats.topLight.forEach(m => { m.color.set(cfg.top); m.color.offsetHSL(0, 0, 0.08); });
  riderMats.jods.forEach(m => m.color.set(cfg.jods));
  if(helmetMesh) helmetMesh.material.color.set(cfg.helmet);
  if(womanHelmet) womanHelmet.material.color.set(cfg.helmet);
}

/* the camera swings between framing the pony and framing the rider */
let camAim = {x:-0.9, y:1.5, dist:6.4}, camNow = {x:-0.9, y:1.5, dist:6.4};
function frameFor(screenId){
  if(screenId === "riderPick") camAim = {x:1.2, y:1.15, dist:2.9};   /* right in on your rider */
  else camAim = {x:-0.9, y:1.5, dist:4.7};                           /* the whole pony, big */
}
window.preview3D = {
  scene, stage, camera,
  dump(){
    const out = [];
    (womanModel || stage).traverse(o => {
      if(!(o.isMesh || o.isSkinnedMesh)) return;
      const bb = o.geometry.boundingBox || (o.geometry.computeBoundingBox(), o.geometry.boundingBox);
      out.push({name:o.name, skinned:!!o.isSkinnedMesh, vis:o.visible, culled:o.frustumCulled,
        wScale:+o.getWorldScale(new THREE.Vector3()).x.toFixed(3),
        wPos:o.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(2)),
        bb:[bb.min.toArray().map(v=>+v.toFixed(1)), bb.max.toArray().map(v=>+v.toFixed(1))],
        mat:o.material && o.material.type, map:!!(o.material && o.material.map),
        opacity:o.material && o.material.opacity, transparent:o.material && o.material.transparent});
    });
    return out;
  },
  setCoat: applyCoat3D,
  setRider: applyRider3D,
  setRiderModel: setRiderModel3D,
  moveTo(screenId){
    const slot = screenId === "riderPick" ? document.getElementById("previewSlotRider")
               : screenId === "coatPick"  ? document.getElementById("previewSlotCoat") : null;
    if(slot && canvas.parentElement !== slot){
      slot.appendChild(canvas);
      const tag = document.createElement("span");
      tag.className = "spin";
      tag.textContent = "drag to spin";
      if(!slot.querySelector(".spin")) slot.appendChild(tag);
    }
    frameFor(screenId);
    resize();
  }
};
function resize(){
  const p = canvas.parentElement;
  if(!p) return;
  const w = p.clientWidth, h = p.clientHeight;
  if(!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

/* drag to spin them round */
let spin = 0.35, dragging = false, lastX = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if(!dragging) return;
  spin -= (e.clientX - lastX) * 0.01;
  lastX = e.clientX;
});

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  for(const m of mixers) m.update(dt);
  if(!dragging) spin += dt * 0.25;
  stage.rotation.y = spin;
  camNow.x += (camAim.x - camNow.x) * Math.min(1, dt*3);
  camNow.y += (camAim.y - camNow.y) * Math.min(1, dt*3);
  camNow.dist += (camAim.dist - camNow.dist) * Math.min(1, dt*3);
  const fx = Math.cos(spin) * camNow.x, fz = -Math.sin(spin) * camNow.x;
  camera.position.set(fx, camNow.y + 0.85, fz + camNow.dist);
  camera.lookAt(fx, camNow.y * 0.75, fz);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

function resetTack(){

  narrate(step.narr.replaceAll("{h}", state.horse));
  animate("nudge");
  $("tackBtn").innerHTML = step.btn;
  if(tackStage === 3){
    $("tackBtn").classList.add("hidden");
    $("rideBtn").classList.remove("hidden");
  }
};

/* ---- riding ---- */
$("rideBtn").onclick = () => {
  if(busy) return;
  busy = true;
  $("stableActions").classList.add("hidden");
  $("sceneWrap").classList.add("fade");
  setTimeout(()=>{
    mode = "riding";
    $("stableBg").style.display = "none";
    $("outdoor").style.display = "";
    $("barnG").style.display = "none";
    $("riderG").style.display = "none";
    $("mountedG").style.display = "";
    $("welcome").textContent = `Riding ${state.horse}`;
    $("sceneWrap").classList.remove("fade");
    $("ridingActions").classList.remove("hidden");
    narrate(`You spring up, find your stirrups, and gather the reins. Ready!`);
    busy = false;
  }, 800);
};

function setGait(g){
  const w = $("sceneWrap");
  w.classList.remove("gait-walk","gait-trot","gait-canter");
  if(g) w.classList.add("gait-"+g);
}

document.querySelectorAll(".gait").forEach(btn=>{
  btn.onclick = ()=>{
    if(mode!=="riding") return;
    setGait(btn.dataset.gait);
    narrate(GAITS[btn.dataset.gait].replaceAll("{h}", state.horse));
    if(btn.dataset.gait==="canter") burst("💨", 4, 0.8);
  };
});

$("haltBtn").onclick = () => {
  if(mode!=="riding") return;
  setGait(null);
  narrate(`Whoa… ${state.horse} halts square and snorts. Perfectly done.`);
};

$("dismountBtn").onclick = () => {
  if(busy) return;
  busy = true;
  setGait(null);
  $("ridingActions").classList.add("hidden");
  $("sceneWrap").classList.add("fade");
  setTimeout(()=>{
    mode = "stable";
    $("outdoor").style.display = "none";
    $("barnG").style.display = "";
    $("stableBg").style.display = "";
    $("riderG").style.display = "";
    resetTack();
    halterOn = true;
    $("halterG").style.display = "";
    $("welcome").textContent = `${state.horse}'s Stable`;
    $("sceneWrap").classList.remove("fade");
    $("stableActions").classList.remove("hidden");
    narrate(`You hop down, run up your stirrups, and untack. ${state.horse} earned that hay net!`);
    busy = false;
  }, 800);
};

$("coatBtn").onclick = () => { if(!busy){ $("pasture").classList.remove("show"); showScreen("coatPick"); } };
$("riderBtn").onclick = () => { if(!busy){ $("pasture").classList.remove("show"); showScreen("riderPick"); } };
$("renameBtn").onclick = () => { if(!busy){ $("pasture").classList.remove("show"); showScreen("start"); } };

if(state.coat && COATS[state.coat]) applyCoat(state.coat);
applyRider();
resetTack();

/* came back from the 3D yard via the Stables button? skip the login, straight to the pasture */
if(location.hash === "#stables" && state.player && state.horse && state.coat){
  showScreen("pasture");
  enterPasture(false);
}
</script>
</body>
</html>
