<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Jill's penguin battle game at the North Pole. three.js r152 + the shared kit.
     Rename this file, the title and the hub card once the game has a name. -->
<title>My New Game ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..600&display=swap">
<link rel="stylesheet" href="design-system.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:#dcecff;}
  canvas{display:block;}
  .bar{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;}
  .bar > *{pointer-events:auto;}
  .pill{background:var(--paper);border:var(--stroke) solid var(--ink);border-radius:20px;padding:6px 14px;
    box-shadow:0 4px 0 var(--ink);font-weight:600;font-size:16px;text-decoration:none;color:inherit;white-space:nowrap;}
  .coins{background:var(--gold);}
  #parts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  #parts span{background:var(--paper);border:var(--stroke) solid var(--ink);border-radius:14px;padding:4px 10px;
    font-size:14px;font-weight:600;opacity:.45;box-shadow:0 3px 0 var(--ink);}
  #parts span.got{opacity:1;background:#bfe6ff;}
  #msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--paper);
    border:var(--stroke) solid var(--ink);border-radius:var(--r-btn);padding:8px 16px;box-shadow:0 4px 0 var(--ink);
    font-size:15px;max-width:calc(100% - 32px);text-align:center;}
  #msg:empty{display:none;}
  #msg{bottom:78px;}
  #info{position:fixed;top:62px;left:50%;transform:translateX(-50%);font-size:15px;pointer-events:none;}
  #cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;}
  #cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1.5px var(--ink);border-radius:1px;}
  #cross::before{left:10px;top:0;width:2px;height:22px;}
  #cross::after{top:10px;left:0;height:2px;width:22px;}
  #prompt{position:fixed;left:50%;top:calc(50% + 44px);transform:translateX(-50%);background:var(--paper);
    border:var(--stroke) solid var(--ink);border-radius:var(--r-btn);padding:6px 14px;font-weight:600;box-shadow:0 4px 0 var(--ink);pointer-events:none;}
  #prompt:empty{display:none;}
  #look{position:fixed;left:50%;top:calc(50% - 70px);transform:translateX(-50%);background:var(--ink);color:#fff;
    border-radius:var(--r-btn);padding:8px 16px;font-weight:600;pointer-events:none;white-space:nowrap;}
  #hpBox{position:fixed;left:16px;bottom:18px;display:flex;align-items:center;gap:8px;background:var(--paper);
    border:var(--stroke) solid var(--ink);border-radius:var(--r-btn);padding:6px 12px;box-shadow:0 4px 0 var(--ink);font-weight:600;}
  #hpBar{width:160px;height:16px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#f6d4d4;}
  #hpBar i{display:block;height:100%;width:100%;background:#4cc36b;transition:width .15s;}
  #inv{position:fixed;right:16px;bottom:18px;display:flex;gap:6px;}
  #inv span{background:var(--paper);border:var(--stroke) solid var(--ink);border-radius:14px;padding:6px 10px;
    font-size:14px;font-weight:600;opacity:.6;box-shadow:0 3px 0 var(--ink);}
  #inv span.on{opacity:1;background:#ffe9a8;transform:translateY(-4px);}
  #inv span.none{display:none;}
  #stormTint,#hurt{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .3s;}
  #stormTint{background:radial-gradient(circle,rgba(160,76,240,.15) 30%,rgba(120,40,200,.6));}
  #hurt{background:radial-gradient(circle,transparent 45%,rgba(230,40,60,.5));}
  #endBox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;text-align:center;background:var(--paper);
    border:var(--stroke) solid var(--ink);border-radius:20px;padding:22px 34px;box-shadow:0 6px 0 var(--ink);}
  #endBox h2{margin:0 0 6px;font-size:32px;}
  #endBox p{margin:0 0 16px;font-size:17px;}
  #again{cursor:pointer;font-family:inherit;background:var(--gold);}
</style>
</head>
<body>
  <div class="bar">
    <a class="pill" href="index.html">🏠 Menu</a>
    <div id="parts"></div>
    <span class="pill coins">🪙 <span id="coinCount">0</span></span>
  </div>
  <div id="msg">Oh no! Your penguin lost its body parts! 🐧 Follow the blue lights to find them. Open golden chests (E) for guns, and watch out for the storm!</div>
  <div id="info" class="pill"></div>
  <div id="cross"></div>
  <div id="look">🖱️ Click the game to look around with the mouse</div>
  <div id="prompt"></div>
  <div id="hpBox">❤️ <div id="hpBar"><i id="hpFill"></i></div><span id="hpNum">100</span></div>
  <div id="inv"></div>
  <div id="stormTint"></div>
  <div id="hurt"></div>
  <div id="endBox"><h2 id="endTitle"></h2><p id="endText"></p><button id="again" class="pill">Play again</button></div>

  <!-- account screen switched off for now while the penguin game is being built -->
  <!-- <script src="account.js"></script> -->
  <!-- the shared kit: one save and one coin purse for every game (docs/shared-kit.md) -->
  <script src="shared/profile.js"></script>
  <script src="shared/wallet.js"></script>
  <script>window.__loadErr = null; addEventListener("error", e => { window.__loadErr = (e.message || "") + " @ " + (e.filename||"") + ":" + (e.lineno||""); });</script>

  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  } }
  </script>
  <script type="module">
  import * as THREE from 'three';

  /* ---- coins: always through the shared purse, never our own count ---- */
  const coinEl = document.getElementById("coinCount");
  const showCoins = () => { coinEl.textContent = JillWallet.balance().toLocaleString(); };
  showCoins();
  JillWallet.onChange(showCoins);

  const msgEl = document.getElementById("msg");
  let msgTimer = setTimeout(() => { msgEl.textContent = ""; }, 7000);
  function flash(text, ms){
    msgEl.textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msgEl.textContent = ""; }, ms || 2500);
  }

  /* ---- scene ---- */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcfe6ff);
  scene.fog = new THREE.Fog(0xdcecff, 35, 95);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9fc4e8, 0.95));
  const sun = new THREE.DirectionalLight(0xfff6e8, 1.0);
  sun.position.set(20, 30, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 100 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;   /* no jaggy shadow speckles on round things */
  scene.add(sun, sun.target);

  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
  const SNOW = mat(0xf4f9ff), ICE = new THREE.MeshStandardMaterial({ color: 0xa8dcff, roughness: 0.2, metalness: 0.1, flatShading: true });

  const MAP = 70;
  const ground = new THREE.Mesh(new THREE.CircleGeometry(MAP, 64), SNOW);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);

  /* same map every time: a tiny seeded random */
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* things you bump into: {x, z, r} */
  const blockers = [];
  function place(obj, x, z, r){ obj.position.set(x, 0, z); scene.add(obj); if(r) blockers.push({ x, z, r }); return obj; }
  function at(o, x, y, z){ o.position.set(x, y, z); return o; }
  function shadowy(g){ g.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } }); return g; }

  function igloo(){
    const g = new THREE.Group();
    const dome = new THREE.Mesh(new THREE.SphereGeometry(2.6, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), SNOW);
    const door = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.6, 16, 1, false, 0, Math.PI), SNOW);
    door.rotation.z = Math.PI / 2; door.rotation.y = Math.PI / 2; door.position.set(0, 0, 2.5);
    const hole = new THREE.Mesh(new THREE.CircleGeometry(0.7, 16, 0, Math.PI), mat(0x24324a));
    hole.position.set(0, 0.01, 3.31);
    g.add(dome, door, hole);
    /* block lines like ice bricks */
    for(let i = 1; i < 4; i++){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(Math.cos(i * 0.36) * 2.62, 0.03, 4, 40), mat(0xc9ddf0));
      ring.rotation.x = Math.PI / 2; ring.position.y = Math.sin(i * 0.36) * 2.62; g.add(ring);
    }
    return shadowy(g);
  }
  function iceberg(){
    const g = new THREE.Group();
    const s = 1.5 + rnd() * 2.5;
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), ICE);
    m.scale.y = 1.2 + rnd(); m.position.y = s * 0.6; m.rotation.y = rnd() * 6;
    g.add(m); g.userData.r = s * 0.95;
    return shadowy(g);
  }
  function pine(){
    const g = new THREE.Group();
    g.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 1, 8), mat(0x7a5236)), 0, 0.5, 0));
    for(let i = 0; i < 3; i++){
      const w = 1.6 - i * 0.4;
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(w, 1.6, 9), mat(0x2f7d5b));
      leaf.position.y = 1.4 + i * 0.9;
      const cap = new THREE.Mesh(new THREE.ConeGeometry(w * 0.7, 0.6, 9), SNOW);
      cap.position.y = leaf.position.y + 0.55;
      g.add(leaf, cap);
    }
    return shadowy(g);
  }
  function snowman(){
    const g = new THREE.Group();
    [[0.8, 0.8], [0.6, 1.9], [0.42, 2.8]].forEach(([r, y]) => g.add(at(new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), SNOW), 0, y, 0)));
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.45, 8), mat(0xff8a2a));
    nose.rotation.x = Math.PI / 2; nose.position.set(0, 2.8, 0.55); g.add(nose);
    const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.45, 16), mat(0x2b2d42));
    hat.position.y = 3.35; g.add(hat);
    return shadowy(g);
  }
  function iceWall(){
    const g = new THREE.Group();
    const len = 4 + rnd() * 5;
    const w = new THREE.Mesh(new THREE.BoxGeometry(len, 1.6, 0.8), ICE);
    w.position.y = 0.8; g.add(w);
    return shadowy(g);
  }

  /* the North Pole itself, in the middle */
  const pole = new THREE.Group();
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 6, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  stick.position.y = 3; pole.add(stick);
  for(let i = 0; i < 6; i++){
    const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.4, 16), mat(0xe8384f));
    stripe.position.y = 0.6 + i * 0.95; pole.add(stripe);
  }
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffc53d, metalness: 0.5, roughness: 0.3 }));
  ball.position.y = 6.3; pole.add(ball);
  place(shadowy(pole), 0, -6, 0.6);

  /* a frozen lake — slippy, for later */
  const lake = new THREE.Mesh(new THREE.CircleGeometry(9, 40), new THREE.MeshStandardMaterial({ color: 0x9fd4f5, roughness: 0.05, metalness: 0.2 }));
  lake.rotation.x = -Math.PI / 2; lake.position.set(26, 0.02, 20); lake.receiveShadow = true;
  scene.add(lake);

  /* scatter the obstacles, keeping the start spot and the lake clear */
  function freeSpot(minGap){
    for(let tries = 0; tries < 200; tries++){
      const a = rnd() * Math.PI * 2, d = 12 + rnd() * (MAP - 18);
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      if(Math.hypot(x - 26, z - 20) < 11) continue;
      if(blockers.some(b => Math.hypot(b.x - x, b.z - z) < b.r + minGap)) continue;
      return [x, z];
    }
    return null;
  }
  for(let i = 0; i < 9;  i++){ const s = freeSpot(5); if(s) place(igloo(), s[0], s[1], 2.7).rotation.y = rnd() * 6; }
  for(let i = 0; i < 14; i++){ const s = freeSpot(3); if(s){ const b = iceberg(); place(b, s[0], s[1], b.userData.r); } }
  for(let i = 0; i < 40; i++){ const s = freeSpot(2); if(s) place(pine(), s[0], s[1], 0.9); }
  for(let i = 0; i < 8;  i++){ const s = freeSpot(2); if(s) place(snowman(), s[0], s[1], 0.9).rotation.y = rnd() * 6; }
  for(let i = 0; i < 10; i++){
    const s = freeSpot(4); if(!s) continue;
    const w = iceWall(); place(w, s[0], s[1], 0).rotation.y = rnd() * 6;
    /* a wall is long: block it with a row of little circles */
    const len = w.children[0].geometry.parameters.width, ang = w.rotation.y;
    for(let t = -len / 2; t <= len / 2; t += 0.8) blockers.push({ x: s[0] + Math.cos(ang) * t, z: s[1] - Math.sin(ang) * t, r: 0.7 });
  }

  /* falling snow */
  const flakes = new THREE.BufferGeometry();
  const N = 1500, fp = new Float32Array(N * 3);
  for(let i = 0; i < N; i++){ fp[i*3] = (Math.random() - 0.5) * 80; fp[i*3+1] = Math.random() * 30; fp[i*3+2] = (Math.random() - 0.5) * 80; }
  flakes.setAttribute("position", new THREE.BufferAttribute(fp, 3));
  const snow = new THREE.Points(flakes, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.85 }));
  scene.add(snow);

  /* ---- the penguin: a little skeleton of joints, each body part hangs off one ----
     Built in code (not a downloaded model) so every part can come off and go back. */
  const BLACK = mat(0x1e2433), WHITE = mat(0xffffff), ORANGE = mat(0xff9a1f);
  function makePenguin(inkHex = 0x1e2433){
    const root = new THREE.Group();
    const hips = new THREE.Group(); hips.position.y = 0.3; root.add(hips);
    /* one egg-shaped body with the white tummy painted on (two overlapping shapes flicker) */
    const geo = new THREE.SphereGeometry(0.5, 48, 36);
    const pos = geo.attributes.position, cols = [];
    const ink = new THREE.Color(inkHex), snowy = new THREE.Color(0xffffff), c = new THREE.Color();
    for(let i = 0; i < pos.count; i++){
      const x = pos.getX(i) / 0.5, y = pos.getY(i) / 0.5, z = pos.getZ(i) / 0.5;
      /* how far inside the tummy patch this point is: front-facing, below the chin */
      const oval = 1 - (x / 0.66) ** 2 - ((y + 0.15) / 0.72) ** 2;
      const inside = Math.min((z - 0.3) / 0.1, oval / 0.12);
      c.copy(ink).lerp(snowy, THREE.MathUtils.clamp(inside, 0, 1));
      cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
    const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 }));
    body.scale.set(1, 1.3, 0.9); body.position.y = 0.55;
    hips.add(body);

    const joints = {
      head:   at(new THREE.Group(), 0, 1.2, 0),
      flipL:  at(new THREE.Group(),  0.48, 0.85, 0),
      flipR:  at(new THREE.Group(), -0.48, 0.85, 0),
      footL:  at(new THREE.Group(),  0.2, -0.28, 0.1),
      footR:  at(new THREE.Group(), -0.2, -0.28, 0.1)
    };
    for(const k in joints) hips.add(joints[k]);
    return { root, hips, joints, body, parts: {} };
  }
  /* each part is its own little model so it can sit on the map on its own */
  const PART_INFO = {
    head:  { label: "Head",          icon: "🐧" },
    flipL: { label: "Left flipper",  icon: "🪽" },
    flipR: { label: "Right flipper", icon: "🪽" },
    footL: { label: "Left foot",     icon: "🦶" },
    footR: { label: "Right foot",    icon: "🦶" }
  };
  const inkMats = {};
  const inkMat = hex => inkMats[hex] || (inkMats[hex] = mat(hex));
  function makePart(k, inkHex = 0x1e2433){
    const g = new THREE.Group();
    const BODY = inkMat(inkHex);
    if(k === "head"){
      const h = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 18), BODY); h.position.y = 0.25;
      const face = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 14), WHITE); face.scale.set(1, 0.85, 0.6); face.position.set(0, 0.22, 0.17);
      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.26, 12), ORANGE); beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.18, 0.4);
      g.add(h, face, beak);
      [0.1, -0.1].forEach(x => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 8), BLACK); eye.position.set(x, 0.3, 0.33);
        const shine = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), WHITE); shine.position.set(x + 0.02, 0.32, 0.38);
        g.add(eye, shine);
      });
    } else if(k === "flipL" || k === "flipR"){
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), BODY);
      f.scale.set(0.14, 0.7, 0.32); f.position.y = -0.32;
      g.add(f);
    } else {
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 10), ORANGE);
      f.scale.set(0.34, 0.12, 0.55); f.position.set(0, 0, 0.1);
      g.add(f);
    }
    return shadowy(g);
  }

  const me = makePenguin();
  shadowy(me.root);
  scene.add(me.root);
  /* round penguin parts get speckly self-shadows, so they cast shadows but don't catch them */
  function noSelfShadow(g){ g.traverse(o => { if(o.isMesh) o.receiveShadow = false; }); }
  noSelfShadow(me.root);
  function attach(p, k, inkHex){
    const part = makePart(k, inkHex);
    p.joints[k].add(part); p.parts[k] = part;
    noSelfShadow(part);
  }

  /* hide the parts around the map, each with a blue light beam so it can be found */
  const lost = [];
  const beamMat = new THREE.MeshBasicMaterial({ color: 0x5cc8ff, transparent: true, opacity: 0.35, depthWrite: false });
  Object.keys(PART_INFO).forEach(k => {
    const s = freeSpot(1.5) || [10, 10];
    const g = new THREE.Group();
    const part = makePart(k);
    part.position.y = 1; part.scale.setScalar(1.6);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 18, 16, 1, true), beamMat);
    beam.position.y = 9;
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.1, 24), ICE);
    g.add(part, beam, pad);
    g.position.set(s[0], 0, s[1]);
    scene.add(g);
    lost.push({ k, g, part });
  });

  /* the parts bar along the top */
  const partsEl = document.getElementById("parts");
  function showParts(){
    partsEl.innerHTML = "";
    for(const k in PART_INFO){
      const s = document.createElement("span");
      s.textContent = PART_INFO[k].icon + " " + PART_INFO[k].label;
      if(me.parts[k]) s.className = "got";
      partsEl.appendChild(s);
    }
  }
  showParts();

  /* coins to pick up */
  const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 24);
  const coinMat = new THREE.MeshStandardMaterial({ color: 0xffc53d, metalness: 0.4, roughness: 0.3 });
  const coins = [];
  function dropCoinAt(x, z, respawn){
    const c = new THREE.Mesh(coinGeo, coinMat);
    c.position.set(x, 0.7, z); c.rotation.x = Math.PI / 2; c.castShadow = true;
    c.userData.respawn = respawn;
    scene.add(c); coins.push(c);
  }
  function dropCoin(){ const s = freeSpot(1); if(s) dropCoinAt(s[0], s[1], true); }
  for(let i = 0; i < 12; i++) dropCoin();

  /* ---- battle bits (Jill: "it's like Fortnite") ----
     Camera behind the penguin, golden chests with guns, bot penguins that throw
     snowballs back, ice walls and ramps you build, a storm that shrinks the map,
     and dancing. */

  /* little synth sounds, no files */
  let actx = null;
  function beep(f1, f2, dur, type, vol){
    try {
      actx = actx || new AudioContext();
      const o = actx.createOscillator(), gn = actx.createGain(), t0 = actx.currentTime;
      o.type = type || "square";
      o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      gn.gain.setValueAtTime(vol || 0.08, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(gn).connect(actx.destination); o.start(t0); o.stop(t0 + dur);
    } catch(e){ console.error("sound", e); }
  }
  const SOUNDS = {
    snow:    () => beep(500, 200, 0.12, "triangle"),
    blaster: () => beep(1400, 300, 0.1, "square", 0.04),
    cannon:  () => beep(220, 60, 0.35, "sawtooth", 0.1),
    hit:     () => beep(900, 1300, 0.08, "triangle"),
    ouch:    () => beep(300, 150, 0.15, "sawtooth", 0.06),
    chest:   () => { beep(660, 990, 0.15, "triangle"); setTimeout(() => beep(990, 1320, 0.2, "triangle"), 120); },
    build:   () => beep(180, 120, 0.12, "square", 0.06),

  /* ---- golden chests ---- */
  const chests = [];

  const GOLD = new THREE.MeshStandardMaterial({ color: 0xffc53d, metalness: 0.6, roughness: 0.3, emissive: 0x7a5200, emissiveIntensity: 0.5 });
  const chestGlow = new THREE.MeshBasicMaterial({ color: 0xffd34d, transparent: true, opacity: 0.22, depthWrite: false });
  function makeChest(){
    const g = new THREE.Group();
    g.add(at(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 0.8), WOOD), 0, 0.3, 0));
    g.add(at(new THREE.Mesh(new THREE.BoxGeometry(1.24, 0.1, 0.84), GOLD), 0, 0.58, 0));

  for(let i = 0; i < 8; i++){
    const s = freeSpot(1.5); if(!s) continue;

  }
  function nearestChest(){
    let best = null, bd = 2.3;
    for(const c of chests){
      if(c.open) continue;
      const d = Math.hypot(c.g.position.x - me.root.position.x, c.g.position.z - me.root.position.z);

  }
  function tryChest(){

  /* ---- building: Q = ice wall, R = ramp ---- */
  const builds = [];
  const BUILD_MAT = new THREE.MeshStandardMaterial({ color: 0xbfe9ff, roughness: 0.25, transparent: true, opacity: 0.85 });
  const RAMP_H = 2.6, WALL_H = 2.6;
  let buildCool = 0;
  function build(kind){
    if(buildCool > 0 || !alive) return;
    buildCool = 0.35;
    placeBuild(kind, me.root.position, Math.round(camYaw / (Math.PI / 2)) * (Math.PI / 2), "me");
  }
  function placeBuild(kind, from, yaw, owner){
    const fx = Math.sin(yaw), fz = Math.cos(yaw), ahead = kind === "wall" ? 2.2 : 2.8;
    const x = from.x + fx * ahead, z = from.z + fz * ahead;
    let mesh;
    if(kind === "wall"){
      mesh = new THREE.Mesh(new THREE.BoxGeometry(4, WALL_H, 0.3), BUILD_MAT);
      mesh.position.set(x, WALL_H / 2, z);
      mesh.rotation.y = yaw;
    } else {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, Math.hypot(4, RAMP_H)), BUILD_MAT);
      mesh.position.set(x, RAMP_H / 2, z);
      mesh.rotation.order = "YXZ"; mesh.rotation.set(-Math.atan2(RAMP_H, 4), yaw, 0);
    }
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    const b = { kind, mesh, x, z, yaw, hp: 5, blocks: [], owner };
    if(kind === "wall"){
      for(let t = -1.8; t <= 1.81; t += 0.6){
        const bl = { x: x + Math.cos(yaw) * t, z: z - Math.sin(yaw) * t, r: 0.4, h: WALL_H, build: true };
        blockers.push(bl); b.blocks.push(bl);
      }
    }
    builds.push(b);
    if(builds.length > 30) removeBuild(builds[0]);
    sfx("build");
  }
  function removeBuild(b){
    scene.remove(b.mesh);
    for(const bl of b.blocks){ const i = blockers.indexOf(bl); if(i >= 0) blockers.splice(i, 1); }
    builds.splice(builds.indexOf(b), 1);
  }
  /* a point in a build's own space: x across, z along */
  function local(b, x, z){
    const dx = x - b.x, dz = z - b.z, c = Math.cos(b.yaw), s = Math.sin(b.yaw);
    return [dx * c - dz * s, dx * s + dz * c];
  }
  function groundAt(x, z){
    let h = 0;
    for(const b of builds){
      if(b.kind !== "ramp") continue;
      const [lx, lz] = local(b, x, z);
      if(Math.abs(lx) <= 2 && Math.abs(lz) <= 2) h = Math.max(h, (lz + 2) / 4 * RAMP_H);
    }
    return h;
  }

  /* ---- the storm ---- */
  const storm = { x: (rnd() - 0.5) * 24, z: (rnd() - 0.5) * 24, r: MAP + 6, from: 0, to: 0 };
  const STORM_STEPS = [[30, 46], [25, 26], [20, 12], [15, 4]];   /* [seconds of calm, new size] */
  const SHRINK_TIME = 30;
  let stormStep = 0, stormMode = "wait", stormTime = STORM_STEPS[0][0];
  const stormWall = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 40, 72, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xa04cf0, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false }));
  stormWall.position.set(storm.x, 20, storm.z);
  scene.add(stormWall);
  function updateStorm(dt){
    if(stormStep < STORM_STEPS.length){
      stormTime -= dt;
      if(stormMode === "wait" && stormTime <= 0){
        stormMode = "shrink"; stormTime = SHRINK_TIME;
        storm.from = storm.r; storm.to = STORM_STEPS[stormStep][1];
        flash("🌀 The storm is closing in! Stay inside the circle.", 3000);
      } else if(stormMode === "shrink"){
        storm.r = storm.to + (storm.from - storm.to) * Math.max(0, stormTime / SHRINK_TIME);
        if(stormTime <= 0){
          stormStep++; stormMode = "wait";
          stormTime = stormStep < STORM_STEPS.length ? STORM_STEPS[stormStep][0] : 0;
        }
      }
    }
    stormWall.scale.set(storm.r, 1, storm.r);
  }
  const inStorm = p => Math.hypot(p.x - storm.x, p.z - storm.z) > storm.r;
  const STORM_HURT = 5;   /* per second */

  /* ---- shots and snow puffs ---- */
  const shots = [], puffs = [];
  const shotBall = new THREE.SphereGeometry(1, 12, 8);
  function fire(from, dir, w, owner){
    const W = WEAPONS[w];
    const m = new THREE.Mesh(shotBall, W.mat);
    m.position.copy(from);
    if(w === "blaster") m.scale.set(W.size, W.size, W.size * 4); else m.scale.setScalar(W.size);

  }
  const puffMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false });
  function puff(p, size, n){
    const mtl = puffMat.clone(), g = new THREE.Group();
    g.position.copy(p);
    for(let k = 0; k < n; k++){
      const m = new THREE.Mesh(shotBall, mtl);
      m.scale.setScalar(size);
      m.userData.v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.8, Math.random() - 0.5).multiplyScalar(size * 14 + 1);
      g.add(m);
    }
    scene.add(g); puffs.push({ g, mtl, life: 0.5 });
  }
  function hitsWall(b, p, size){
    if(b.kind !== "wall" || p.y > WALL_H) return false;
    const [lx, lz] = local(b, p.x, p.z);
    return Math.abs(lx) < 2 && Math.abs(lz) < 0.15 + size;
  }

  /* ---- you ---- */
  let hp = 100, alive = true, ended = false, kos = 0;

  function showHp(){
    hpFill.style.width = hp + "%";

  }
  let hurtTimer = 0;
  function hurtMe(n, quiet){
    if(!alive || ended) return;

  }

  /* ---- the other penguins ----
     Good bots: they race to chests for guns, pick the nearest enemy (you or
     each other), keep a good distance for their weapon, dodge side to side,
     jump, aim where you're going, and build a wall for cover when they're hit. */
  const BOT_COLS = [0xd94848, 0x8a4fd8, 0x2f9e5b, 0xe86aa8, 0x2f6fd8, 0xe8892f, 0x2bb5b5, 0xd4b200, 0x6d6d80, 0x8b5a2b];
  const BOT_SPEED = 3.6;
  const HURTS_YOU = 0.45;   /* bots' shots hurt you less than they hurt each other, so it stays fair */
  const RANGE = { snow: [7, 14], blaster: [9, 18], cannon: [9, 16] };
  const bots = [];
  const meVel = new THREE.Vector3();
  BOT_COLS.forEach(col => {
    let s = null;
    for(let k = 0; k < 30; k++){ const c = freeSpot(1.5); if(c && Math.hypot(c[0], c[1]) > 18){ s = c; break; } }
    if(!s) return;
    const p = makePenguin(col);
    for(const k in PART_INFO) attach(p, k, col);
    shadowy(p.root); noSelfShadow(p.root);
    const botHand = at(new THREE.Group(), -0.62, 0.75, 0.3);
    p.hips.add(botHand);
    p.root.position.set(s[0], 0, s[1]);
    scene.add(p.root);
    const b = { p, hand: botHand, hp: 100, alive: true, walkT: Math.random() * 6, target: null, retarget: 0,
                cool: 1 + Math.random() * 2, side: 1, sideT: 0, flashT: 0, vy: 0, onGround: true,
                weapon: "snow", ammo: { snow: Infinity, blaster: 0, cannon: 0 },

  });
  function botHold(b){ b.hand.clear(); b.hand.add(gunModel(b.weapon)); }
  const botsLeft = () => bots.filter(b => b.alive).length;
  function nearestChestTo(pos, maxD){
    let best = null, bd = maxD;
    for(const c of chests){
      if(c.open) continue;
      const d = Math.hypot(c.g.position.x - pos.x, c.g.position.z - pos.z);
      if(d < bd){ bd = d; best = c; }
    }
    return best;
  }

  /* by = "me", a bot, or null for the storm */
  function hurtBot(b, dmg, by){
    if(!b.alive) return;
    b.hp -= dmg; b.flashT = 0.12;
    if(by === "me") sfx("hit");
    if(by){
      /* fight back, and maybe throw up a wall */
      b.foe = by; b.foeT = 2;
      const from = by === "me" ? me.root.position : by.p.root.position, pos = b.p.root.position;
      if(b.buildT <= 0 && Math.random() < 0.45){
        b.buildT = 5;
        placeBuild("wall", pos, Math.round(Math.atan2(from.x - pos.x, from.z - pos.z) / (Math.PI / 2)) * (Math.PI / 2), b);
      }
    }
    if(b.hp <= 0) knockOut(b, by);
  }
  function knockOut(b, by){
    b.alive = false;
    const p = b.p.root.position;
    puff(new THREE.Vector3(p.x, p.y + 0.8, p.z), 0.35, 14);
    scene.remove(b.p.root);
    sfx("poof");
    for(let k = 0; k < 3; k++) dropCoinAt(p.x + (Math.random() - 0.5) * 2.4, p.z + (Math.random() - 0.5) * 2.4, false);
    if(by === "me") kos++;
    const left = botsLeft();
    if(!ended && alive){
      if(!left) win();
      else flash((by === "me" ? "💥 You knocked out a penguin! " : by ? "💥 A penguin got knocked out! " : "🌀 The storm got a penguin! ") + left + " left.", 2500);
    }
  }
  function botShoot(b, fpos, fvel, d){
    const W = WEAPONS[b.weapon];
    const from = b.hand.getWorldPosition(new THREE.Vector3());
    const flight = d / W.speed;
    /* aim where the enemy is going to be, with a little wobble */
    const target = new THREE.Vector3(fpos.x + fvel.x * flight, fpos.y + 0.8, fpos.z + fvel.z * flight);
    const spread = 0.2 + d * 0.03;
    target.x += (Math.random() - 0.5) * spread * 2;
    target.z += (Math.random() - 0.5) * spread * 2;
    target.y += (Math.random() - 0.5) * spread + 0.5 * W.grav * flight * flight;
    fire(from, target.sub(from).normalize(), b.weapon, b);
    if(b.weapon !== "snow" && --b.ammo[b.weapon] <= 0){ b.weapon = b.ammo.blaster ? "blaster" : b.ammo.cannon ? "cannon" : "snow"; botHold(b); }
    b.cool = W.rate * (b.weapon === "blaster" ? 1.6 : 1.4) + Math.random() * 0.35;
  }
  function updateBot(b, dt, t){
    const pos = b.p.root.position;
    b.buildT -= dt;
    /* who to fight: the nearest enemy, you or another penguin */
    b.foeT -= dt;
    if(b.foe === "me" && (!alive || ended)) b.foe = null;
    if(b.foe && b.foe !== "me" && !b.foe.alive) b.foe = null;
    if(b.foeT <= 0){
      b.foeT = 0.5; b.foe = null;
      let best = 30;
      if(alive && !ended){ const d = Math.hypot(me.root.position.x - pos.x, me.root.position.z - pos.z) * 0.85; if(d < best){ best = d; b.foe = "me"; } }
      for(const o of bots){
        if(o === b || !o.alive) continue;
        const d = Math.hypot(o.p.root.position.x - pos.x, o.p.root.position.z - pos.z);
        if(d < best){ best = d; b.foe = o; }
      }
    }
    const fpos = b.foe === "me" ? me.root.position : b.foe ? b.foe.p.root.position : null;
    const fvel = b.foe === "me" ? meVel : b.foe ? b.foe.vel : null;
    const fd = fpos ? Math.hypot(fpos.x - pos.x, fpos.z - pos.z) : Infinity;
    const chest = b.weapon === "snow" ? nearestChestTo(pos, 35) : null;

    let mx = 0, mz = 0, face = null;
    const goTo = (x, z) => { const dx = x - pos.x, dz = z - pos.z, d = Math.hypot(dx, dz) || 1; mx = dx / d; mz = dz / d; };
    if(Math.hypot(pos.x - storm.x, pos.z - storm.z) > storm.r - 2){
      goTo(storm.x, storm.z);
    } else if(fpos && fd < 26 && !(chest && fd > 12)){
      const dx = fpos.x - pos.x, dz = fpos.z - pos.z, d = fd || 1;
      face = Math.atan2(dx, dz);
      const [near, far] = RANGE[b.weapon];
      if(d > far){ mx = dx / d; mz = dz / d; }
      else if(d < near){ mx = -dx / d; mz = -dz / d; }
      /* dodge side to side */
      b.sideT -= dt;
      if(b.sideT <= 0){ b.side = Math.random() < 0.5 ? 1 : -1; b.sideT = 0.5 + Math.random() * 1.3; }
      mx += -dz / d * b.side * 0.9; mz += dx / d * b.side * 0.9;
      if(b.onGround && Math.random() < dt * 0.5) b.vy = 7;
      b.cool -= dt;
      if(b.cool <= 0 && d < 28) botShoot(b, fpos, fvel, d);
    } else if(chest){
      goTo(chest.g.position.x, chest.g.position.z);
      if(Math.hypot(chest.g.position.x - pos.x, chest.g.position.z - pos.z) < 1.7){
        chest.open = true; chest.glow.visible = false;
        const w = Math.random() < 0.6 ? "blaster" : "cannon";
        b.ammo[w] += WEAPONS[w].ammo; b.weapon = w; botHold(b);
      }
    } else {
      b.retarget -= dt;
      if(!b.target || b.retarget <= 0 || Math.hypot(b.target[0] - pos.x, b.target[1] - pos.z) < 1.5){
        const a = Math.random() * Math.PI * 2, r = Math.random() * storm.r * 0.7;
        b.target = [storm.x + Math.cos(a) * r, storm.z + Math.sin(a) * r];
        b.retarget = 6;
      }
      goTo(b.target[0], b.target[1]);
    }
    const len = Math.hypot(mx, mz), moving = len > 0.01;
    if(moving){
      b.vel.set(mx / len * BOT_SPEED, 0, mz / len * BOT_SPEED);
      pos.x += b.vel.x * dt; pos.z += b.vel.z * dt;
      bump(pos, pos.y);
      b.walkT += dt * 11;
    } else b.vel.set(0, 0, 0);
    const want = face !== null ? face : moving ? Math.atan2(mx, mz) : b.p.root.rotation.y;
    let turn = want - b.p.root.rotation.y;
    turn = Math.atan2(Math.sin(turn), Math.cos(turn));
    b.p.root.rotation.y += turn * Math.min(1, dt * 10);
    /* jumping and ramps */
    const floor = groundAt(pos.x, pos.z);
    b.vy -= 22 * dt; pos.y += b.vy * dt;
    if(pos.y <= floor){ pos.y = floor; b.vy = 0; b.onGround = true; } else b.onGround = false;
    animate(b.p, moving, b.walkT, 0, 2, 0, t);
    b.flashT -= dt;
    b.p.body.material.emissive.setHex(b.flashT > 0 ? 0xffffff : 0x000000);
    if(inStorm(pos)) hurtBot(b, STORM_HURT * dt, null);
  }

  /* ---- winning and losing ---- */
  const endBox = document.getElementById("endBox");
  function endGame(title, text){
    ended = true; shooting = false;

    document.getElementById("endText").textContent = text;
    document.getElementById("cross").style.display = "none";
    lookEl.style.display = "none";
    endBox.style.display = "block";
  }
  function win(){ endGame("🏆 Victory Royale!", "You beat all the penguins! Knockouts: " + kos); }
  function lose(){
    alive = false;
    puff(me.root.position.clone().setY(me.root.position.y + 0.8), 0.35, 14);
    me.root.visible = false;
    sfx("poof");

  document.getElementById("again").addEventListener("click", () => location.reload());

  /* debug handle for the console and tests */
  window.__ng = { THREE, scene, camera, me, lost, coins, blockers, chests, bots, builds, storm, shots,
    get state(){ return { hp, alive, ended, kos, weapon, ammo: { ...ammo }, camYaw, stormStep, stormMode, stormTime }; },
    aim(yaw, pitch){ camYaw = yaw; if(pitch !== undefined) camPitch = pitch; },
    build, tryChest, fire: on => { shooting = on; }, hurtMe };

  /* ---- controls: WASD moves, mouse aims (click the game first), click shoots ---- */
  const keys = {};
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if(e.key === " " || k.startsWith("arrow")) e.preventDefault();
    if(e.repeat || ended) return;
    if(k === "1" || k === "2" || k === "3"){ const w = ORDER[+k - 1]; if(ammo[w]){ weapon = w; holdWeapon(); } }
    if(k === "q") build("wall");
    if(k === "r") build("ramp");
    if(k === "b") dance = 3;
    if(k === "e") tryChest();
    if(k === " " && onGround && alive){ vy = 7.5; onGround = false; }
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  const canvas = renderer.domElement;
  const lookEl = document.getElementById("look");
  const locked = () => document.pointerLockElement === canvas;
  canvas.addEventListener("mousedown", e => {
    if(ended || e.button !== 0) return;
    /* the first click grabs the mouse for looking around; after that, clicks shoot */
    if(!locked() && canvas.requestPointerLock && !lockFailed){ canvas.requestPointerLock(); return; }
    shooting = true;
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  addEventListener("mouseup", e => { if(e.button === 0) shooting = false; });
  addEventListener("mousemove", e => {
    /* locked mouse, or holding the right button and dragging */
    if(!locked() && !(e.buttons & 2)) return;
    camYaw -= e.movementX * 0.0025;
    camPitch = THREE.MathUtils.clamp(camPitch + e.movementY * 0.002, -0.3, 0.8);
  });
  let lockFailed = false;
  const showLook = () => { lookEl.style.display = locked() || ended ? "none" : "block"; };
  document.addEventListener("pointerlockchange", showLook);
  document.addEventListener("pointerlockerror", () => {
    lockFailed = true;
    lookEl.textContent = "🖱️ Hold the right mouse button and drag to look around";
  });
  showLook();
  addEventListener("blur", () => { for(const k in keys) keys[k] = false; shooting = false; });

  function bump(pos, y){
    for(const b of blockers){
      if(b.h !== undefined && y > b.h - 0.2) continue;
      const dx = pos.x - b.x, dz = pos.z - b.z, d = Math.hypot(dx, dz), min = b.r + 0.45;
      if(d < min && d > 0.0001){ pos.x = b.x + dx / d * min; pos.z = b.z + dz / d * min; }
    }
    const far = Math.hypot(pos.x, pos.z);
    if(far > MAP - 1){ pos.x *= (MAP - 1) / far; pos.z *= (MAP - 1) / far; }
  }

  /* waddle, hop, slide and dance for any penguin */
  function animate(p, moving, walkT, sliding, feet, dancing, t){
    const step = Math.sin(walkT), j = p.joints;
    if(feet){
      p.hips.position.y = 0.3 + (moving ? Math.abs(step) * 0.06 : 0);
      p.hips.rotation.z = moving ? step * 0.14 : 0;
      j.footL.rotation.x = moving ? Math.max(0, step) * -0.6 : 0;
      j.footR.rotation.x = moving ? Math.max(0, -step) * -0.6 : 0;
    } else {
      /* hopping on its tummy with no feet */
      p.hips.position.y = 0.3 + (moving ? Math.abs(Math.sin(walkT * 0.9)) * 0.35 : 0);
      p.hips.rotation.z = 0;
    }
    j.flipL.rotation.z = (moving ? 0.35 + Math.sin(walkT * 1.3) * 0.25 : 0.12) + sliding * 1.2;
    p.hips.rotation.x = sliding * 1.35;
    p.hips.position.y -= sliding * 0.2;
    j.head.rotation.x = -sliding * 1.1;
    p.hips.rotation.y = 0;
    if(dancing > 0){
      p.hips.rotation.y = Math.sin(t * 7) * 0.7;
      p.hips.position.y = 0.3 + Math.abs(Math.sin(t * 9)) * 0.3;
      p.hips.rotation.z = Math.sin(t * 9) * 0.2;
      j.flipL.rotation.z = 1.6 + Math.sin(t * 14) * 0.6;
      j.head.rotation.x = Math.sin(t * 9) * 0.2;
    }
    j.flipR.rotation.z = -j.flipL.rotation.z;
  }

  /* ---- loop ---- */
  const clock = new THREE.Clock();
  let walkT = 0, sliding = 0;
  const camPos = new THREE.Vector3(), look = new THREE.Vector3(), tmp = new THREE.Vector3();
  const ray = new THREE.Ray(), sphere = new THREE.Sphere();
  const infoEl = document.getElementById("info"), promptEl = document.getElementById("prompt");
  showHp();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    const feet = (me.parts.footL ? 1 : 0) + (me.parts.footR ? 1 : 0);
    const flippers = me.parts.flipL && me.parts.flipR;
    const pos = me.root.position;
    buildCool -= dt; fireCool -= dt; dance -= dt;

    if(keys.arrowleft) camYaw += dt * 2.4;
    if(keys.arrowright) camYaw -= dt * 2.4;
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw), rx = -fz, rz = fx;
    const fwd = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
    const side = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    const moving = alive && !ended && !!(fwd || side);
    if(moving) dance = 0;
    /* no feet: slow little hops. Both flippers: hold C to belly-slide */
    sliding = (moving && flippers && keys.c) ? Math.min(1, sliding + dt * 4) : Math.max(0, sliding - dt * 4);
    const speed = sliding > 0.5 ? 10 : [2.2, 3.4, 5.5][feet];
    meVel.set(0, 0, 0);
    if(moving){
      const mx = fx * fwd + rx * side, mz = fz * fwd + rz * side, len = Math.hypot(mx, mz);
      meVel.set(mx / len * speed, 0, mz / len * speed);
      pos.x += meVel.x * dt;
      pos.z += meVel.z * dt;
      bump(pos, pos.y);
      walkT += dt * (feet ? 11 : 7);
    }
    /* the penguin always faces where you're aiming */
    let turn = camYaw - me.root.rotation.y;
    turn = Math.atan2(Math.sin(turn), Math.cos(turn));
    me.root.rotation.y += turn * Math.min(1, dt * 14);

    /* jumping, ramps and falling */
    const floor = groundAt(pos.x, pos.z);
    vy -= 22 * dt;
    pos.y += vy * dt;
    if(pos.y <= floor){ pos.y = floor; vy = 0; onGround = true; }
    else onGround = pos.y - floor < 0.05;

    animate(me, moving, walkT, sliding, feet, dance, t);

    /* shooting: aim where the crosshair is pointing */
    if(shooting && fireCool <= 0 && alive && !ended){
      const W = WEAPONS[weapon];
      fireCool = W.rate;
      camera.getWorldDirection(tmp);
      ray.set(camera.position, tmp);
      let reach = 40;
      for(const b of bots){
        if(!b.alive) continue;
        sphere.set(b.p.root.position.clone().setY(b.p.root.position.y + 0.8), 0.8);
        const hitAt = ray.intersectSphere(sphere, look);
        if(hitAt){ const d = hitAt.distanceTo(camera.position); if(d < reach) reach = d; }
      }
      const aimAt = camera.position.clone().addScaledVector(tmp, reach);
      const from = hand.getWorldPosition(new THREE.Vector3());
      const flight = aimAt.distanceTo(from) / W.speed;
      aimAt.y += 0.5 * W.grav * flight * flight;
      fire(from, aimAt.sub(from).normalize(), weapon, "me");
      sfx(weapon);
      if(ammo[weapon] !== Infinity){
        ammo[weapon]--;
        if(!ammo[weapon]){ weapon = "snow"; holdWeapon(); flash("Out of ammo! Find another chest. 🎁"); }
        else showInv();
      }
      dance = 0;
    }

    /* shots flying */
    for(let i = shots.length - 1; i >= 0; i--){
      const s = shots[i], W = WEAPONS[s.w], p = s.m.position;
      s.v.y -= W.grav * dt;
      p.addScaledVector(s.v, dt);
      s.life -= dt;
      if(s.w === "blaster") s.m.lookAt(tmp.copy(p).add(s.v));
      let hit = s.life <= 0 || p.y <= 0 || Math.hypot(p.x, p.z) > MAP;
      if(!hit && p.y < 3) hit = blockers.some(b => !b.build && Math.hypot(p.x - b.x, p.z - b.z) < b.r);
      if(!hit){
        const wall = builds.find(b => b.owner !== s.owner && hitsWall(b, p, W.size));
        if(wall){ hit = true; if(--wall.hp <= 0){ puff(wall.mesh.position.clone(), 0.4, 12); removeBuild(wall); } }
      }
      if(!hit && s.owner !== "me" && alive && Math.hypot(p.x - pos.x, p.y - (pos.y + 0.8), p.z - pos.z) < 0.75){
        hit = true; if(!W.splash) hurtMe(W.dmg * HURTS_YOU);
      }
      if(!hit){
        const b = bots.find(b => b.alive && b !== s.owner && Math.hypot(p.x - b.p.root.position.x, p.y - (b.p.root.position.y + 0.8), p.z - b.p.root.position.z) < 0.8);
        if(b){ hit = true; if(!W.splash) hurtBot(b, W.dmg, s.owner); }
      }
      if(hit){
        if(W.splash){
          for(const b of bots) if(b.alive && b !== s.owner && Math.hypot(p.x - b.p.root.position.x, p.z - b.p.root.position.z) < W.splash) hurtBot(b, W.dmg, s.owner);
          if(s.owner !== "me" && alive && Math.hypot(p.x - pos.x, p.z - pos.z) < W.splash) hurtMe(W.dmg * HURTS_YOU);
          puff(p.clone(), 0.4, 16);
        } else puff(p.clone(), W.size * 0.8, 6);
        scene.remove(s.m); shots.splice(i, 1);
      }
    }
    for(let i = puffs.length - 1; i >= 0; i--){
      const f = puffs[i];
      f.life -= dt;
      f.g.children.forEach(m => { m.position.addScaledVector(m.userData.v, dt); m.scale.multiplyScalar(1 + dt * 2); });
      f.mtl.opacity = Math.max(0, f.life / 0.5 * 0.9);
      if(f.life <= 0){ scene.remove(f.g); f.mtl.dispose(); puffs.splice(i, 1); }
    }

    for(const b of bots) if(b.alive) updateBot(b, dt, t);

    /* the storm hurts */
    updateStorm(dt);
    const stormy = alive && inStorm(pos);
    tintEl.style.opacity = stormy ? 1 : 0;
    if(stormy) hurtMe(STORM_HURT * dt, true);

    /* chests */
    for(const c of chests){
      if(c.open && c.lidT < 1){ c.lidT = Math.min(1, c.lidT + dt * 3); c.lid.rotation.x = -1.9 * c.lidT; }
      if(!c.open) c.glow.material.opacity = 0.16 + Math.sin(t * 3) * 0.08;
    }
    promptEl.textContent = alive && !ended && nearestChest() ? "Press E to open the chest 🎁" : "";

    /* find a lost part */
    for(let i = lost.length - 1; i >= 0; i--){
      const L = lost[i];
      L.part.rotation.y += dt * 1.5;
      L.part.position.y = 1 + Math.sin(t * 2 + i) * 0.2;
      if(alive && Math.hypot(L.g.position.x - pos.x, L.g.position.z - pos.z) < 1.3){
        scene.remove(L.g); lost.splice(i, 1);
        attach(me, L.k); showParts();
        const got = JillWallet.earn("new-game:found-part");
        const hint = { footL: "Feet make you faster!", footR: "Feet make you faster!",
                       flipL: "Find both flippers to belly-slide (hold C)!", flipR: "Find both flippers to belly-slide (hold C)!",
                       head: "Now you can see where you're going!" }[L.k];
        if(!lost.length) flash("🎉 Your penguin is all back together! +" + got + " 🪙", 5000);
        else flash("Found the " + PART_INFO[L.k].label.toLowerCase() + "! +" + got + " 🪙 " + hint, 4000);
      }
    }

    /* coins */
    for(let i = coins.length - 1; i >= 0; i--){
      const c = coins[i];
      c.rotation.z += dt * 3;
      if(alive && Math.hypot(c.position.x - pos.x, c.position.z - pos.z) < 0.9 && pos.y < 1.5){
        scene.remove(c); coins.splice(i, 1);
        const got = JillWallet.earn("new-game:pick-up");
        if(got) flash("+" + got + " 🪙");
        if(c.userData.respawn) setTimeout(dropCoin, 3000);
      }
    }

    /* top info: penguins left and the storm clock */
    const stormText = stormStep >= STORM_STEPS.length ? "" :
      stormMode === "wait" ? " · 🌀 Storm in " + Math.ceil(stormTime) + "s" : " · 🌀 Storm closing!";
    infoEl.textContent = "🐧 " + botsLeft() + " left · 💥 " + kos + stormText;

    /* snow drifts down around you */
    const pa = flakes.attributes.position.array;
    for(let i = 0; i < N; i++){
      pa[i*3+1] -= dt * (1.2 + (i % 5) * 0.2);
      if(pa[i*3+1] < 0) pa[i*3+1] = 30;
    }
    flakes.attributes.position.needsUpdate = true;
    snow.position.set(pos.x, 0, pos.z);

    /* sun's shadows follow you */
    sun.position.set(pos.x + 20, 30, pos.z + 12);
    sun.target.position.copy(pos);

    /* camera over the right shoulder. No head = it's a bit foggy! */
    scene.fog.far = me.parts.head ? 95 : 40;
    const cp = Math.cos(camPitch), sp = Math.sin(camPitch), eyeY = pos.y + 1.5;
    /* pull the camera in if it would end up inside an iceberg, igloo or wall */
    let dist = 7;
    for(let k = 1; k <= 10; k++){
      const d = 7 * k / 10, cx = pos.x - fx * d * cp + rx * 0.9 * k / 10, cz = pos.z - fz * d * cp + rz * 0.9 * k / 10, cy = eyeY + d * sp;
      if(blockers.some(b => cy < (b.h !== undefined ? b.h : 4) && Math.hypot(cx - b.x, cz - b.z) < b.r + 0.3)){ dist = Math.max(1.2, d - 0.7); break; }
    }
    const shoulder = 0.9 * dist / 7;
    camPos.set(pos.x - fx * dist * cp + rx * shoulder, Math.max(0.4, eyeY + dist * sp), pos.z - fz * dist * cp + rz * shoulder);
    camera.position.copy(camPos);
    look.set(camPos.x + fx * cp, camPos.y - sp, camPos.z + fz * cp);
    camera.lookAt(look);
    renderer.render(scene, camera);
  });
  </script>
</body>
</html>
